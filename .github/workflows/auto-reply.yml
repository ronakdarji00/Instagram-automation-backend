name: Instagram Auto-Reply

on:
  schedule:
    # Har 5 minute me run karo (GitHub Actions ka minimum interval)
    - cron: "*/5 * * * *"
  workflow_dispatch: # Manual trigger ke liye

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    permissions:
      contents: write # State file commit karne ke liye

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-reply script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_REPLY_MESSAGE: ${{ secrets.IG_REPLY_MESSAGE }}
          IG_MAX_COMMENTS: "50"
        run: python main.py

      - name: Save state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add replied_comments.json || true
          if git diff --staged --quiet; then
            echo "No changes to state file"
          else
            git commit -m "Update replied comments state [skip ci]"
            git push
          fi
